<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-2deg); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.08); }
      }
      .floating-card-1 { animation: float1 6s ease-in-out infinite; }
      .floating-card-2 { animation: float2 7s ease-in-out infinite; }
      .pulsing-orb { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .title-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; fill: #ffffff; }
      .subtitle-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; fill: #94a3b8; }
      .badge-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Glowing Orbs -->
  <circle class="pulsing-orb" cx="150" cy="80" r="180" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle class="pulsing-orb" cx="1050" cy="240" r="200" fill="#c084fc" opacity="0.2" filter="url(#glow)"/>

  <!-- Decorative Grid Lines -->
  <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M200 0 V320 M400 0 V320 M600 0 V320 M800 0 V320 M1000 0 V320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Floating UI Preview Elements -->
  <!-- Card 1: Score & Metrics -->
  <g class="floating-card-1" transform="translate(820, 45)">
    <rect width="320" height="100" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#glow)"/>
    <text x="20" y="35" class="badge-text" fill="#a855f7">🎯 Prompt Metric Assessment</text>
    <text x="20" y="65" class="subtitle-text" font-size="14">Faithfulness Score: <tspan fill="#34d399" font-weight="700">98.4%</tspan></text>
    <text x="20" y="85" class="subtitle-text" font-size="12">Hallucination Index: <tspan fill="#f43f5e" font-weight="700">0.01</tspan></text>
    <circle cx="280" cy="50" r="22" fill="#6366f1" opacity="0.2"/>
    <path d="M272 50 L278 56 L290 44" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Card 2: Multi-Model Evaluation -->
  <g class="floating-card-2" transform="translate(850, 170)">
    <rect width="300" height="95" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" filter="url(#glow)"/>
    <text x="20" y="32" class="badge-text" fill="#38bdf8">⚡ LLM-as-a-Judge</text>
    <!-- Progress Bars -->
    <rect x="20" y="48" width="180" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="48" width="150" height="8" rx="4" fill="url(#accent-grad)"/>
    <text x="210" y="56" class="badge-text" font-size="11">GPT-4o</text>

    <rect x="20" y="68" width="180" height="8" rx="4" fill="#334155"/>
    <rect x="20" y="68" width="135" height="8" rx="4" fill="#38bdf8"/>
    <text x="210" y="76" class="badge-text" font-size="11">Claude 3.5</text>
  </g>

  <!-- Main Banner Title & Typography -->
  <g transform="translate(70, 110)">
    <!-- Top Pill Tag -->
    <rect x="0" y="-55" width="270" height="32" rx="16" fill="url(#accent-grad)" opacity="0.25" stroke="url(#accent-grad)" stroke-width="1"/>
    <text x="15" y="-34" class="badge-text" fill="#f3e8ff">🚀 LLM &amp; Prompt Quality Assurance</text>

    <!-- Main Title -->
    <text x="0" y="25" class="title-text" font-size="44" letter-spacing="-1">Awesome Prompt Evaluation</text>

    <!-- Dynamic Glowing Accent Line -->
    <rect x="0" y="42" width="520" height="4" rx="2" fill="url(#accent-grad)"/>

    <!-- Subtitle -->
    <text x="0" y="80" class="subtitle-text" font-size="18" width="600">
      Curated Ecosystem of LLM Testing, RAG Assessment, Red-Teaming &amp; Observability Tools
    </text>
  </g>

  <!-- Dynamic Sparkles / Stars -->
  <path d="M 680 90 Q 685 90 685 85 Q 685 90 690 90 Q 685 90 685 95 Q 685 90 680 90 Z" fill="#fbbf24" class="pulsing-orb"/>
  <path d="M 750 220 Q 756 220 756 214 Q 756 220 762 220 Q 756 220 756 226 Q 756 220 750 220 Z" fill="#c084fc" class="pulsing-orb"/>
</svg>
